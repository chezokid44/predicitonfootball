<!--
  Author : John Astill (c)
  Date   : 7 April 2003
  Desc   : This is an example implementation of showing the leaderboard. This can 
         : be integrated into an HTML page.
         : To modify the number of players displayed, look at the file 
         : getleaderboard.php .
-->
<html>
  <head>
    <title>
      Example of showing leaderboard in HTML
    </title>
    <link rel="stylesheet" href="common.css" type="text/css">
<!--
The following code between the script tags should be placed in your HTML file 
where you normally put your javascript.
-->
    <script>
    <!--
      // Show the leaders in the given table.
      // This requires an IFRAME for the callback
      // to be successful.
      function setLeaderBoard(leaders,points) {
        var length = leaders.length;

        // ID of the table
        var tabname = "ldrbdtbl";

        var bodyref = document.getElementById("leaderboard");

        var old = document.getElementById(tabname);
        if (old == null) {
          alert("Unable to get table "+tabname);
          return;
        }
        var newtbl = document.createElement("table");
        newtbl.id = tabname;
        newtbl.className = "";
        newtbl.setAttribute("border","0");
        newtbl.setAttribute("width","140");

        var newtbody = document.createElement("tbody");
        newtbl.appendChild(newtbody);

        // Create the header
        var row = document.createElement("tr");

        var text = document.createTextNode("");
        var cell = document.createElement("td");
        cell.className = "tblhead";
        var font = document.createElement("font");
        font.className = "TBLHEAD";
        font.appendChild(text);
        cell.appendChild(font);
        row.appendChild(cell);

        text = document.createTextNode("User");
        cell = document.createElement("td");
        cell.className = "TBLHEAD";
        font = document.createElement("font");
        font.className = "TBLHEAD";
        font.appendChild(text);
        cell.appendChild(font);
        row.appendChild(cell);

        text = document.createTextNode("Pts");
        cell = document.createElement("td");
        cell.className = "TBLHEAD";
        font = document.createElement("font");
        font.className = "TBLHEAD";
        font.appendChild(text);
        cell.appendChild(font);
        row.appendChild(cell);

        newtbody.appendChild(row);

        for (var i=0; i<length; i++) {
          row = document.createElement("tr");

          text = document.createTextNode(i+1);
          cell = document.createElement("td");
          cell.className = "TBLROW";
          font = document.createElement("font");
          font.className = "TBLROW";
          font.appendChild(text);
          cell.appendChild(font);
          row.appendChild(cell);

          text = document.createTextNode(leaders[i]);
          cell = document.createElement("td");
          cell.className = "TBLROW";
          font = document.createElement("font");
          font.className = "TBLROW";
          font.appendChild(text);
          cell.appendChild(font);
          row.appendChild(cell);

          text = document.createTextNode(points[i]);
          cell = document.createElement("td");
          cell.className = "TBLROW";
          cell.setAttribute("align","right");
          font = document.createElement("font");
          font.className = "TBLROW";
          font.appendChild(text);
          cell.appendChild(font);
          row.appendChild(cell);

          newtbody.appendChild(row);
        }
        bodyref.replaceChild(newtbl,old);
        
      }
    -->
    </script>
  </head>
  <body>
    <a target="TBLFRAME" href="getleaderboard.php">Update the table</a>
    <p>
<!--
The code below should be placed in your HTML where you want the table placing.
-->
    <div id="leaderboard">
      <table id="ldrbdtbl">
        <tr><td></td></tr>
      </table>
    </div>
    <iframe id="TBLFRAME" name="TBLFRAME" style="width:0px; height:0px;border:0px" src="getleaderboard.php"></iframe>
<!--
This is the end of the code that should be included.
--> 
  </body>
</html>
